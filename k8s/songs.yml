apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-ms
  namespace: k8s-program
spec:
  replicas: 2                      # две копии пода
  selector:
    matchLabels:
      app: songs-ms                # какими подами управляет Deployment
  template:                        # шаблон пода
    metadata:
      labels:
        app: songs-ms              # метка должна совпадать с selector
    spec:
      enableServiceLinks: false    # чтобы Kubernetes сам не добавил в под переменную
      containers:
        - name: songs-ms
          image: songs-image:2.0
          imagePullPolicy: IfNotPresent   # брать локальный образ, не качать из интернета
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: songs-storage
              mountPath: /data             # каталог внутри контейнера, который хранится на PV
          env:
            - name: SONGS_DB_URL
              value: songs-db      # имя Service базы = её адрес в кластере
            - name: SONGS_DB_PORT
              value: "5432"
            - name: SONGS_MS_PORT
              value: "8081"
      volumes:
        - name: songs-storage
          persistentVolumeClaim:
            claimName: songs-pvc           # ссылка на PVC ниже
---
apiVersion: v1
kind: Service
metadata:
  name: songs-ms                   # по этому имени resources-service найдёт songs
  namespace: k8s-program
spec:
  type: NodePort
  selector:
    app: songs-ms                  # трафик идёт на поды с этой меткой
  ports:
    - port: 8081                   # порт Service внутри кластера
      targetPort: 8081             # порт контейнера
      nodePort: 30081              # порт снаружи (30000–32767)
---
# PersistentVolumeClaim - запрос пода на хранилище. Привязывается к PV с тем же storageClassName.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: songs-pvc
  namespace: k8s-program
spec:
  storageClassName: manual
  volumeName: songs-pv               # привязать именно к нашему PV
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
