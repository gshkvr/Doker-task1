apiVersion: apps/v1
kind: Deployment
metadata:
  name: resources-ms
  namespace: k8s-program
spec:
  replicas: 2                      # две копии пода
  selector:
    matchLabels:
      app: resources-ms                # какими подами управляет Deployment
  template:                        # шаблон пода
    metadata:
      labels:
        app: resources-ms              # метка должна совпадать с selector
    spec:
      enableServiceLinks: false    # чтобы Kubernetes сам не добавил в под переменную
      containers:
        - name: resources-ms
          image: resources-image:2.0
          imagePullPolicy: IfNotPresent   # брать локальный образ, не качать из интернета
          ports:
            - containerPort: 8080
          env:
            - name: RESOURCES_DB_URL
              value: resources-db      # имя Service базы = её адрес в кластере
            - name: RESOURCES_DB_PORT
              value: "5432"
            - name: RESOURCES_MS_PORT
              value: "8080"
            - name: SONGS_MS_URL
              value: songs-ms
            - name: SONGS_MS_PORT
              value: "8081"
---
apiVersion: v1
kind: Service
metadata:
  name: resources-ms                   # по этому имени songs найдёт resources-service
  namespace: k8s-program
spec:
  type: NodePort
  selector:
    app: resources-ms                  # трафик идёт на поды с этой меткой
  ports:
    - port: 8080                   # порт Service внутри кластера
      targetPort: 8080             # порт контейнера
      nodePort: 30080              # порт снаружи (30000–32767)